  /v1/soundlinks/{soundlinkId}/test-events:
    post:
      operationId: sendSoundlinkTestEvents
      summary: Send a test conversion event for a soundlink
      description: |
        Sends the same test conversion event as the in-app "send test event"
        action. Pixels and tokens are read from the soundlink. This request
        has no body.

        When the soundlink has a Meta pixel, a live Meta Conversions API event
        named `Soundlink Stream` is sent to that pixel. When it has a TikTok
        pixel, a live TikTok `ViewContent` event is sent as well. These are
        not sandbox events: they appear in the ad platform's events manager.

        Requires `soundlinks:write`. Unknown ids, another organization's
        soundlink, and campaign-linked soundlinks return `404`. Archived
        self-serve soundlinks are allowed. A soundlink with neither pixel
        returns `400`. Does not require `Idempotency-Key`; each call sends a
        new event.

        **Auth:** Accepts API key or OAuth Bearer (`soundlinks:write`).
      tags: [Soundlinks]
      security:
