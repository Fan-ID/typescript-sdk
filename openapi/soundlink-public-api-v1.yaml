  /v1/soundlinks/{soundlinkId}/metrics/retention:
    get:
      operationId: getSoundlinkRetention
      summary: Soundlink cohort retention
      description: |
        Cohort retention for a soundlink: one row per cohort date that has first
        plays (dates with no first plays have no row), where the cohort date is
        the UTC date listeners first played via the soundlink. A listener's
        cohort date is their earliest first play across all countries.
        Conforms to the `soundlink_cohort_retention_daily` v1.0 schema. All rows
        are returned in `data.items` (one per cohort date), so there is no
        pagination.

        **Retention definitions:**
        - `returned_on_day_N`: listeners from the cohort who played again on exactly day N
          after their first play.
        - `retention_by_day_N`: share of the cohort (`cohort_size`) who played again on any
          day from 1 to N (end-day, cumulative). Each listener is counted once, so the
          by-day rate never decreases within a row.
        - A day-N value is `null` until day N has passed for that cohort date.

        **Known limitation:** end-day rates are cumulative per listener, so whether
        day-3 returners also returned on day 2 is not recoverable from the end-day
        columns. Use the exact-day `returned_on_day_N` columns for day-by-day behaviour.

        `soundlink_target_isrc` is currently always `null`.

        **Date range:** `startDate` / `endDate` filter the cohort date (both inclusive).
        If you omit both, a recent window ending today is used. A range that is too wide
        returns `400 invalid_query_parameter`.

        **Plan requirement:** Label, Enterprise, committed, and self-serve plans.
        Organizations on a lower plan receive `403 premium_plan_required`.

        Requires the `soundlinks:read` scope. Accepts API key or OAuth Bearer.
      tags: [Soundlinks]
      security:
        - apiKeyBearerAuth: []
        - oauthBearer: []
      x-required-scope: soundlinks:read
      x-premium-plan-level-min: 3
      parameters:
        - $ref: '#/components/parameters/soundlinkId'
        - $ref: '#/components/parameters/startDate'
        - $ref: '#/components/parameters/endDate'
      responses:
        '200':
          description: Cohort retention rows (`soundlink_cohort_retention_daily` schema), sorted by `cohort_date` ascending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoundlinkCohortRetentionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PremiumAnalyticsForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/soundlinks/{soundlinkId}/listening-insights/{insight}:
    get:
      operationId: getSoundlinkListeningInsight
      summary: Soundlink listening insights
      description: |
        What listeners who connected through this soundlink went on to play.
        The date window comes from the listening graph (`nodes_smart_link`).
        `startDate` and `endDate` are not accepted. Extra query parameters are ignored.

        This request often takes 30–50 seconds. Use a client timeout of at least 120 seconds.
        If the API Gateway deadline elapses, the response is `504`. That body is the gateway error, not the Public API envelope.

        - `other-artists` — other artists these listeners streamed, excluding attributed tracks and campaign artists. Top 30.
        - `catalog-dig-in` — playlist reach and catalog follow-through per artist. Track soundlinks may return `artists: []`.
        - `stream-split` — `track` soundlinks return attributed contexts such as `promoted` and `artist_catalog`. `playlist` soundlinks return `playlist` then `artist_catalog`. A context is omitted when listeners and streams are both 0. Any other campaign type returns `200` with `contexts: []`.

        **Plan requirement:** Label, Enterprise, committed, and self-serve plans.
        Organizations on a lower plan receive `403 premium_plan_required`.

        Requires the `soundlinks:read` scope. Accepts API key or OAuth Bearer.
        A soundlink created for a campaign is allowed here when the organization owns it,
        even though `GET /v1/soundlinks/{soundlinkId}` does not return campaign soundlinks.
        An unknown soundlink, or one owned by another organization, returns `404 not_found`.
        An owned soundlink with no listening-graph row returns `404 not_in_listening_graph`
        (`Soundlink not available in listening graph`).
      tags: [Soundlinks]
      security:
        - apiKeyBearerAuth: []
        - oauthBearer: []
      x-required-scope: soundlinks:read
      x-premium-plan-level-min: 3
      x-recommended-timeout-seconds: 120
      parameters:
        - $ref: '#/components/parameters/soundlinkId'
        - $ref: '#/components/parameters/listeningInsight'
      responses:
        '200':
          description: Listening insight for the soundlink window. The `data.insight` value matches the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListeningInsightsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PremiumAnalyticsForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '504':
          description: |
            The API Gateway deadline of 120 seconds elapsed. The body is the gateway error, not the Public API envelope (`data` or `error`, plus `meta`).

  /v1/videos/import:
    post:
      operationId: importVideo
      summary: Import video(s) from public HTTPS MP4 or QuickTime URL(s)
      description: |
        Accepts a single `url` or a `videos` array (1–5 items). Creates one upload
        session, enqueues async download/staging, and returns `202` with `sessionId`.
        URLs may be MP4 (`video/mp4`) or QuickTime (`.mov` / `video/quicktime`).
        Unsupported types return `invalid_video_content_type`.
        QuickTime imports stay `processing` while they transcode to MP4, then
        follow the same ingest path as native MP4.

        Requires the `videos:write` scope. Subject to a stricter per-credential rate
        limit than generic public API routes (default 20 imports per hour per API key
        or OAuth grant). This caps how many import requests are accepted per hour,
        not how long ingestion takes.

        Poll `GET /v1/videos/import/{sessionId}` until `status` is `ready`, `partial`,
        or `failed`. For single-URL imports, use `videoId` when ready. For batches
        (`count > 1`), use `videoIds`.
      tags: [Videos]
      security:
        - apiKeyBearerAuth: []
        - oauthBearer: []
      x-required-scope: videos:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoImportRequest'
            examples:
              single:
                summary: Single URL (legacy)
                value:
                  url: 'https://cdn.example.com/promo.mp4'
              batch:
                summary: Batch of URLs
                value:
                  videos:
                    - url: 'https://cdn.example.com/a.mp4'
                    - url: 'https://cdn.example.com/b.mov'
      responses:
        '200':
          description: Duplicate video already in the organization's library (sync legacy path only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoImportStartResponse'
        '202':
          description: Import accepted; ingestion in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoImportStartResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/videos/import/{sessionId}:
    get:
      operationId: getVideoImportStatus
      summary: Get video import session status
      description: |
        Returns processing status. For single-URL sessions, includes `videoId` when ready.
        For batch sessions (`count > 1`), includes `videoIds` and `counts`.
        Requires the `videos:write` scope.
      tags: [Videos]
      security:
        - apiKeyBearerAuth: []
        - oauthBearer: []
      x-required-scope: videos:write
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Upload session ID returned by `POST /v1/videos/import`
      responses:
        '200':
          description: Import session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoImportStatusResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    apiKeyBearerAuth:
      type: http
      scheme: bearer
      description: |
        Pass your Soundlink `sk_*` API key as a Bearer token:
        `Authorization: Bearer sk_<prefix>_<token>` (not an OAuth token; see
        `oauthBearer` for that). Accepted on all Public API operations. Send
        only one `Authorization` header per request.

    oauthBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth 2.0 access token from Sign in with Soundlink
        (`Authorization: Bearer <oauth_access_token>`).
        Token scopes must include the operation's required scope
        (see `x-required-scope` and the Authentication section).
        Accepted on all Public API operations (reads and writes).

  parameters:
    campaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
      description: Campaign identifier (UUID)

    listeningInsight:
      name: insight
      in: path
      required: true
      schema:
        type: string
        enum: [other-artists, catalog-dig-in, stream-split]
      description: |
        `other-artists` — what else these listeners stream.
        `catalog-dig-in` — playlist artists and catalog follow-through.
        `stream-split` — promoted, playlist, and artist-catalog split.

    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: |
        A unique string identifying this request, used to safely retry write
        operations (campaign create/stop/budget, soundlink create) without repeating
        side effects. Required on every request that references this parameter.
        Reusing this key with an unchanged request body replays the original
        response; reusing it with a different body returns
        `409 idempotency_key_conflict`. Keys are honored for 24 hours.

    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)

    pageSize100:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Items per page (max 100)

    pageSize500:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      description: Rows per page (max 500; higher default than list endpoints)

    sortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: Sort direction

    startDate:
      name: startDate
      in: query
      schema:
        type: string
        format: date
      description: |
        Inclusive start date (`YYYY-MM-DD`). When omitted, the default depends
        on the endpoint: campaign overview and paginated breakdown use the
        campaign start date; engagement and JSONL export endpoints use the
        last 90 days ending today (see each operation).

    endDate:
      name: endDate
      in: query
      schema:
        type: string
        format: date
      description: Inclusive end date (`YYYY-MM-DD`). Defaults to today.

    soundlinkId:
      name: soundlinkId
      in: path
      required: true
      schema:
        type: string
      description: Soundlink identifier (URL-safe string, same ID used in the public sndl.ink URL)

    soundlinkStartDate:
      name: startDate
      in: query
      schema:
        type: string
        format: date
      description: |
        Inclusive start date (`YYYY-MM-DD`) for soundlink overview and
        breakdown. Defaults to the soundlink creation date when omitted.

    soundlinkEndDate:
      name: endDate
      in: query
      schema:
        type: string
        format: date
      description: Inclusive end date (`YYYY-MM-DD`). Defaults to today.

  schemas:
    # --- Shared ---

    Meta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
          description: Server-generated request ID. Include when contacting support.

    WalletData:
      type: object
      required: [balance, available, reserved, currency, updatedAt]
      properties:
        balance:
          type: number
        available:
          type: number
        reserved:
          type: number
        currency:
          type: string
          enum: [USD]
        updatedAt:
          type: string
          format: date-time
          nullable: true

    GetWalletResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/WalletData'
        meta:
          $ref: '#/components/schemas/Meta'

    # --- Pixels ---

    PixelPlatform:
      type: string
      enum: [meta]
      description: Ad platform for the pixel. Only `meta` is supported today.

    Pixel:
      type: object
      required: [id, platform]
      properties:
        id:
          type: string
        platform:
          $ref: '#/components/schemas/PixelPlatform'

    PixelListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [pixels]
          properties:
            pixels:
              type: array
              items:
                $ref: '#/components/schemas/Pixel'
              description: Pixels configured for the organization. Empty when none is saved.
        meta:
          $ref: '#/components/schemas/Meta'

    UpdatePixelRequest:
      type: object
      required: [platform, accessToken]
      properties:
        platform:
          $ref: '#/components/schemas/PixelPlatform'
        accessToken:
          type: string
          minLength: 1
          description: Conversions API access token. Stored and never returned.

    UpdatePixelResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Pixel'
        meta:
          $ref: '#/components/schemas/Meta'

    PixelTestEventResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status, pixelId]
          properties:
            status:
              type: string
              enum: [sent]
            pixelId:
              type: string
        meta:
          $ref: '#/components/schemas/Meta'

    Pagination:
      type: object
      required: [page, pageSize, totalCount, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer

    ListeningInsightWindow:
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
          example: '2026-07-30'
        endDate:
          type: string
          format: date
          example: '2026-09-29'

    OtherArtistsListeningInsight:
      type: object
      required: [soundlinkId, campaignId, insight, window, artists]
      properties:
        soundlinkId:
          type: string
        campaignId:
          type: string
          nullable: true
        insight:
          type: string
          enum: [other-artists]
        window:
          $ref: '#/components/schemas/ListeningInsightWindow'
        artists:
          type: array
          maxItems: 30
          items:
            type: object
            required: [artist, listeners, streams]
            properties:
              artist:
                type: string
                description: Lowercased, trimmed artist name.
              listeners:
                type: number
              streams:
                type: number

    CatalogDigInListeningInsight:
      type: object
      required: [soundlinkId, campaignId, insight, window, artists]
      properties:
        soundlinkId:
          type: string
        campaignId:
          type: string
          nullable: true
        insight:
          type: string
          enum: [catalog-dig-in]
        window:
          $ref: '#/components/schemas/ListeningInsightWindow'
        artists:
          type: array
          maxItems: 30
          items:
            type: object
            required:
              - artist
              - playlistListeners
              - playlistStreams
              - catalogListeners
              - catalogStreams
              - catalogTracks
              - catalogListenerRate
            properties:
              artist:
                type: string
              playlistListeners:
                type: number
              playlistStreams:
                type: number
              catalogListeners:
                type: number
              catalogStreams:
                type: number
              catalogTracks:
                type: number
              catalogListenerRate:
                type: number
                nullable: true
                description: catalogListeners / playlistListeners. Null when playlistListeners is 0.

    StreamSplitContext:
      type: object
      required: [engagementContext, listeners, streams, tracks]
      properties:
        engagementContext:
          type: string
          description: '`promoted`, `playlist`, or `artist_catalog`.'
        listeners:
          type: number
        streams:
          type: number
        tracks:
          type: number

    StreamSplitListeningInsight:
      type: object
      required: [soundlinkId, campaignId, insight, window, contexts]
      properties:
        soundlinkId:
          type: string
        campaignId:
          type: string
          nullable: true
        insight:
          type: string
          enum: [stream-split]
        window:
          $ref: '#/components/schemas/ListeningInsightWindow'
        contexts:
          type: array
          description: Empty when the graph `campaign_type` is neither `track` nor `playlist`. The response is still `200`.
          items:
            $ref: '#/components/schemas/StreamSplitContext'

    ListeningInsightsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/OtherArtistsListeningInsight'
            - $ref: '#/components/schemas/CatalogDigInListeningInsight'
            - $ref: '#/components/schemas/StreamSplitListeningInsight'
          discriminator:
            propertyName: insight
            mapping:
              other-artists: '#/components/schemas/OtherArtistsListeningInsight'
              catalog-dig-in: '#/components/schemas/CatalogDigInListeningInsight'
              stream-split: '#/components/schemas/StreamSplitListeningInsight'
        meta:
          $ref: '#/components/schemas/Meta'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable snake_case error code.
          enum:
            - invalid_api_key
            - api_key_revoked
            - api_key_expired
            - insufficient_scope
            - not_found
            - not_in_listening_graph
            - campaign_not_found
            - invalid_query_parameter
            - invalid_date_range
            - page_size_exceeded
            - invalid_request
            - invalid_genre
            - invalid_duration_or_budget
            - invalid_daily_budget
            - invalid_duration_days
            - invalid_spotify_url
            - invalid_tier_budget_allocation
            - invalid_tier_status
            - learning_edit_ack_required
            - wallet_not_enabled
            - premium_plan_required
            - soundlink_plan_required
            - custom_pixel_not_enabled
            - meta_pixel_conflict
            - insufficient_credit
            - idempotency_key_conflict
            - rate_limit_exceeded
            - invalid_video_url
            - video_import_limit_exceeded
            - video_import_session_not_found
            - internal_error
        message:
          type: string
          description: Human-readable error description. Do not parse programmatically.
        details:
          type: object
          nullable: true
          description: |
            Additive, error-code-specific context (e.g. `available`/`required`
            on `insufficient_credit`). Absent or `null` for error codes that
            carry no extra data.
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          $ref: '#/components/schemas/Error'
        meta:
          $ref: '#/components/schemas/Meta'

    # --- Campaign ---

    CampaignStatus:
      type: string
      enum:
        [
          creating,
          active,
          inactive,
          ended,
          renewing,
          restarting,
          restart_failed,
          renew_awaiting_charge,
          renew_failed,
          stopped,
        ]

    CampaignSummary:
      type: object
      required:
        [
          campaignId,
          organizationId,
          status,
          socialPlatform,
          dailyBudget,
          totalBudget,
          campaignDuration,
          generation,
          artistId,
          artistName,
          trackId,
          playlistId,
          trackName,
          campaignUrl,
          createdAt,
          updatedAt,
        ]
      properties:
        campaignId:
          type: string
        organizationId:
          type: string
        status:
          $ref: '#/components/schemas/CampaignStatus'
        socialPlatform:
          type: string
          enum: [meta]
        dailyBudget:
          type: number
          description: USD
        totalBudget:
          type: number
          description: USD
        campaignDuration:
          type: integer
          description: Duration in days
        generation:
          type: integer
          enum: [1, 2, 3]
          description: |
            Campaign resource generation. `1` = Stripe / one-time / subscription /
            legacy; `2` = Soundlink managed; `3` = wallet. Public API write
            operations (budget changes, stop, tier updates) are supported for
            generation `3` only.
        artistId:
          type: string
          nullable: true
          description: |
            Follow-attribution Spotify artist ID (`artist_id_follow`).
            This is the artist campaign follows are credited to, not the
            track's credit list (collabs/features are omitted). Use this
            to group campaigns for one artist. `null` when unset.
        artistName:
          type: string
          nullable: true
          description: |
            Cached display name for `artistId` only — not derived from the
            track's artists. `null` when unknown or unset.
        trackId:
          type: string
          nullable: true
          description: |
            Promoted Spotify track ID, parsed from the smart link URL.
            `null` for playlist campaigns or when the URL is not a track.
            Stable join key for the song; same grain as
            `campaign_target_spotify_track_id` on metrics breakdown.
        playlistId:
          type: string
          nullable: true
          description: |
            Promoted Spotify playlist ID, parsed from the smart link URL.
            `null` for track campaigns or when the URL is not a playlist.
            Same grain as `campaign_target_playlist_id` on metrics breakdown.
        trackName:
          type: string
          nullable: true
          description: |
            Promoted track title. `null` for playlist campaigns or when unknown.
        campaignUrl:
          type: string
          format: uri
          description: |
            Logged-in campaign insights URL in the Soundlink product
            (`/orgs/{organizationId}/insights/{smartLinkId}`). Uses the smart
            link id, not the campaign id. Requires a Soundlink account in this
            organization. This is not a public share link.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CampaignDetail:
      allOf:
        - $ref: '#/components/schemas/CampaignSummary'
        - type: object
          properties:
            strategyType:
              type: string
              description: |
                Growth strategy (e.g. `custom`, `maximum_growth`, `market_discovery`).
                Set at campaign creation.
            autoRenew:
              type: boolean
              description: |
                Whether this wallet campaign renews at the end of each cycle.
                `false` when auto-renew is off or the campaign has no stored value.
            nextRenewalAt:
              type: string
              format: date-time
              nullable: true
              description: |
                When the current wallet cycle ends and the campaign renews.
                `null` unless the campaign is wallet-funded, auto-renew is on,
                and a cycle end is stored.

    CampaignListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CampaignSummary'
            pagination:
              $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/Meta'

    CampaignDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CampaignDetail'
        meta:
          $ref: '#/components/schemas/Meta'

    CampaignTier:
      type: object
      required: [tierId, tierName, isEnabled, allocationPercent, learningStatus]
      properties:
        tierId:
          type: integer
          description: Targeting tier identifier.
        tierName:
          type: string
          description: Human-readable tier name.
        isEnabled:
          type: boolean
          description: Whether this tier is currently active.
        allocationPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Share of campaign budget allocated to this tier.
        learningStatus:
          type: string
          nullable: true
          enum: [LEARNING, FAIL, SUCCESS]
          description: |
            Stored ad set learning status for this tier. `null` means no status
            is stored and does not require acknowledgement before a tier edit.

    CampaignTiersData:
      type: object
      required: [lastUpdate, tiers]
      properties:
        lastUpdate:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO-8601 timestamp of the last manual tier status update, or null
            if tiers have never been updated.
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/CampaignTier'

    CampaignTiersResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CampaignTiersData'
        meta:
          $ref: '#/components/schemas/Meta'

    CampaignActivityItem:
      type: object
      required: [event_type, timestamp, summary]
      properties:
        event_type:
          type: string
          description: Activity event type.
        timestamp:
          type: string
          format: date-time
          description: When the event was recorded.
        summary:
          type: string
          description: Short description. Omits fees, payment ids, and file URIs.

    CampaignActivityData:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CampaignActivityItem'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CampaignActivityResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CampaignActivityData'
        meta:
          $ref: '#/components/schemas/Meta'

    TierStatusUpdateItem:
      type: object
      required: [targetingTierId, isEnabled, newAllocationPercent]
      properties:
        targetingTierId:
          type: integer
          minimum: 1
          description: Targeting tier identifier.
        isEnabled:
          type: boolean
          description: Whether to enable or disable this tier.
        newAllocationPercent:
          type: number
          minimum: 0
          maximum: 100
          description: New budget share for this tier (all items must sum to 100).

    UpdateCampaignTiersRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TierStatusUpdateItem'
        acknowledgeLearningWarning:
          type: boolean
          description: |
            Set to true to continue a tier edit while ad sets are still learning.
            Omit or false to leave the warning unacknowledged.

    Genre:
      type: string
      description: Strictly validated against the platform's genre list.
      enum:
        - Alternative/Indie
        - Ambient/Sleep
        - Chill/Background
        - Classical
        - Country
        - Electronic/Dance
        - Hip-Hop/R&B
        - Latin/Reggaeton
        - Pop
        - Rock
        - Christmas

    StrategyType:
      type: string
      enum:
        - maximum_growth
        - market_discovery
        - revenue_maximization
        - custom

    CreativeDirection:
      description: |
        How the campaign's ad creative is produced. Omit entirely to use the
        platform's default (`do_it_for_me`).
      oneOf:
        - $ref: '#/components/schemas/DoItForMeCreativeDirection'
        - $ref: '#/components/schemas/FullControlCreativeDirection'
      discriminator:
        propertyName: type
        mapping:
          do_it_for_me: '#/components/schemas/DoItForMeCreativeDirection'
          full_control: '#/components/schemas/FullControlCreativeDirection'

    DoItForMeCreativeDirection:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [do_it_for_me]
          description: Soundlink selects and produces the ad creative.

    FullControlCreativeDirection:
      type: object
      required: [type, selectedCreatives]
      properties:
        type:
          type: string
          enum: [full_control]
        selectedCreatives:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SelectedCreative'
          description: One or more previously imported video creatives to use for the ad. Required for full control.

    SelectedCreative:
      type: object
      required: [videoId]
      properties:
        videoId:
          type: string
          format: uuid
          description: |
            ID of a video previously imported into your video library. Import
            videos via the video import endpoint before referencing them here.

    CustomTier:
      type: object
      required: [name, percentBudget]
      properties:
        name:
          type: string
        countries:
          type: array
          items:
            type: string
          description: ISO 3166-1 alpha-2 country codes.
        language:
          type: string
          description: ISO 639-1 language code.
        percentBudget:
          type: number
          description: Share of the campaign budget allocated to this tier. All tiers in a request must sum to 100.

    TierTargeting:
      type: object
      description: |
        Custom tier targeting. Required when `strategyType` is `custom`: provide a
        non-empty `customTierIds` and/or `customTiers` array. Omit entirely for
        non-custom strategies (platform default tiering applies).
      properties:
        customTierIds:
          type: array
          items:
            type: integer
        customTiers:
          type: array
          description: |
            Inline custom tiers to create with the campaign. At most 5 active
            tiers (percentBudget > 0) are allowed; inactive (0%) entries do not
            count toward that limit. Each active tier must receive at least
            $1.50 of dailyBudget (gross). percentBudget values must sum to 100.
          items:
            $ref: '#/components/schemas/CustomTier'

    CreateCampaignRequestShared:
      type: object
      required: [spotifyUrl, dailyBudget, durationDays, genre]
      properties:
        spotifyUrl:
          type: string
          format: uri
          description: |
            Spotify track or playlist URL to promote. Must be a valid track or
            playlist link to a resource that currently exists on Spotify.
        dailyBudget:
          type: number
          minimum: 10
          description: |
            USD, per day. Must be at least 10 (same floor as the Soundlink UI).
        durationDays:
          description: |
            Campaign duration in days. Must be an integer from 7 to 30 (UI custom
            range), or 60, or 90 (UI dropdown extras).
          oneOf:
            - type: integer
              minimum: 7
              maximum: 30
            - type: integer
              enum: [60, 90]
        genre:
          $ref: '#/components/schemas/Genre'
        campaignName:
          type: string
          description: Optional. Server generates a default (track title + short random suffix) when omitted.
        creativeDirection:
          $ref: '#/components/schemas/CreativeDirection'
        trackOptions:
          type: object
          description: Options that only apply when `spotifyUrl` is a track link. Ignored when `spotifyUrl` is a playlist link.
          properties:
            artistIdFollow:
              type: string
              description: Pass-through artist identifier.
        clonedFromCampaignId:
          type: string
          format: uuid
          description: >-
            Optional UUID of a campaign in your organization this create is
            cloned from. Records lineage only — it does not copy settings from
            the source; all other create fields must still be provided. Unknown
            or other-organization IDs return `400 invalid_request`.
        autoRenew:
          type: boolean
          default: false
          description: >-
            When true, the wallet campaign renews at the end of each cycle if
            credit remains. When false or omitted, auto-renew stays off. A
            renewal can cost more than create because of ad fees.

    CreateCampaignRequestWithoutTiers:
      allOf:
        - $ref: '#/components/schemas/CreateCampaignRequestShared'
        - type: object
          required: [strategyType]
          properties:
            strategyType:
              type: string
              enum:
                - maximum_growth
                - market_discovery
                - revenue_maximization
              description: |
                Non-custom growth strategy. Do not send `tierTargeting` with these
                values; the platform applies default tiering.
          not:
            required: [tierTargeting]

    CreateCampaignRequestCustom:
      allOf:
        - $ref: '#/components/schemas/CreateCampaignRequestShared'
        - type: object
          required: [strategyType, tierTargeting]
          properties:
            strategyType:
              type: string
              enum: [custom]
              description: |
                Custom growth strategy. Requires `tierTargeting` with a non-empty
                `customTierIds` and/or `customTiers` array.
            tierTargeting:
              $ref: '#/components/schemas/TierTargeting'

    CreateCampaignRequest:
      description: |
        Create a wallet-funded campaign. When `strategyType` is `custom`,
        `tierTargeting` is required. For `maximum_growth`, `market_discovery`,
        or `revenue_maximization`, do not send `tierTargeting` (platform default
        tiering applies).
      oneOf:
        - $ref: '#/components/schemas/CreateCampaignRequestWithoutTiers'
        - $ref: '#/components/schemas/CreateCampaignRequestCustom'

    CampaignCreateData:
      type: object
      required: [campaignId, status, autoRenew]
      properties:
        campaignId:
          type: string
        status:
          $ref: '#/components/schemas/CampaignStatus'
        autoRenew:
          type: boolean
          description: Stored auto-renew flag for this wallet campaign.

    CreateCampaignResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CampaignCreateData'
        meta:
          $ref: '#/components/schemas/Meta'

    CampaignStopData:
      type: object
      required: [campaignId, status]
      properties:
        campaignId:
          type: string
        status:
          $ref: '#/components/schemas/CampaignStatus'
          description: |
            Campaign status after stop. `stopped` when stop applied or the
            campaign was already stopped. `ended` when the campaign had
            already ended.

    StopCampaignResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CampaignStopData'
        meta:
          $ref: '#/components/schemas/Meta'

    UpdateCampaignAutoRenewRequest:
      type: object
      required: [autoRenew]
      properties:
        autoRenew:
          type: boolean

    CampaignAutoRenewData:
      type: object
      required: [campaignId, autoRenew]
      properties:
        campaignId:
          type: string
        autoRenew:
          type: boolean

    UpdateCampaignAutoRenewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CampaignAutoRenewData'
        meta:
          $ref: '#/components/schemas/Meta'

    StrategyCatalogItem:
      type: object
      required: [strategyType, tierTargetingAllowed]
      properties:
        strategyType:
          $ref: '#/components/schemas/StrategyType'
        tierTargetingAllowed:
          type: boolean
          description: |
            When `false`, omit `tierTargeting` on create (platform default
            tiering applies). Only `custom` allows `tierTargeting`.

    StrategiesCatalogData:
      type: object
      required: [strategies]
      properties:
        strategies:
          type: array
          items:
            $ref: '#/components/schemas/StrategyCatalogItem'

    StrategiesCatalogResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/StrategiesCatalogData'
        meta:
          $ref: '#/components/schemas/Meta'

    BudgetIncreaseMode:
      type: string
      enum: [current_cycle, next_renewal, current_and_renewals]
      description: |
        Defaults to `current_and_renewals` when omitted on increase requests.

    BudgetDecreaseMode:
      type: string
      enum: [current_cycle, current_and_renewals]
      description: |
        Defaults to `current_and_renewals` when omitted on decrease requests.
        `next_renewal` is not supported for decreases.

    IncreaseCampaignBudgetRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          description: |
            Wallet debit / top-up amount in USD. Must be positive, except
            `mode: next_renewal` with `targetDailyBudget` where `amount` may
            be `0`.
        mode:
          $ref: '#/components/schemas/BudgetIncreaseMode'
        targetDailyBudget:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: |
            Optional absolute next-cycle daily budget (USD). Most useful with
            `mode: next_renewal`.

    IncreaseCampaignBudgetData:
      type: object
      required: [campaignId, mode, amount, walletBalance]
      properties:
        campaignId:
          type: string
        mode:
          $ref: '#/components/schemas/BudgetIncreaseMode'
        amount:
          type: number
        walletBalance:
          type: number
          description: Organization wallet balance after the increase.
        walletNextCycleDailyBudget:
          type: number
          nullable: true
          description: Next-cycle daily budget when set by this request.

    IncreaseCampaignBudgetResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/IncreaseCampaignBudgetData'
        meta:
          $ref: '#/components/schemas/Meta'

    DecreaseCampaignBudgetRequest:
      type: object
      required: [targetDailyBudget]
      properties:
        targetDailyBudget:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: |
            New daily budget in USD (gross). Must be at least the campaign's
            enabled-ad-set minimum gross and lower than the campaign's current
            daily budget.
        mode:
          $ref: '#/components/schemas/BudgetDecreaseMode'

    DecreaseCampaignBudgetData:
      type: object
      required: [campaignId, mode, targetDailyBudget, accepted]
      properties:
        campaignId:
          type: string
        mode:
          $ref: '#/components/schemas/BudgetDecreaseMode'
        targetDailyBudget:
          type: number
        accepted:
          type: boolean
          enum: [true]
          description: |
            Always `true` on success. Unused budget refund is applied
            asynchronously after acceptance.
        walletNextCycleDailyBudget:
          type: number
          nullable: true
          description: |
            Present for `current_and_renewals` when the next-cycle daily
            budget was updated. Omitted for `current_cycle`.

    DecreaseCampaignBudgetResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/DecreaseCampaignBudgetData'
        meta:
          $ref: '#/components/schemas/Meta'

    # --- Metrics ---

    MetricsOverview:
      type: object
      description: |
        Campaign-level totals for the requested date range. Spend, streams,
        followers, delivery, and `listeners` come from summing
        `campaign_country_daily` rows. `total_listeners` is distinct listeners
        in the window (same definition as the dashboard), so it is not the sum
        of daily `total_listeners` from breakdown rows.
      required:
        [
          listeners,
          total_listeners,
          streams,
          followers,
          spend_media,
          spend_total,
          fees,
          currency,
          cpl,
          cpf,
          streams_per_listener,
        ]
      properties:
        listeners:
          type: integer
          description: |
            Attributed new Spotify listeners in the window (dashboard Super
            Listeners). Same basis as `cpl`. Sum of country-day `listeners`.
        total_listeners:
          type: integer
          description: |
            Distinct listeners in the window (new + returning). Same basis as
            dashboard S/L. Not equal to the sum of breakdown `total_listeners`.
        streams:
          type: integer
          description: Attributed Spotify streams (sum of country rows).
        followers:
          type: integer
          description: Attributed artist follower gains (sum of country rows).
        impressions:
          type: integer
          nullable: true
          description: Total Meta ad impressions. Null if not available.
        ad_clicks:
          type: integer
          nullable: true
          description: Total Meta ad clicks (all click types).
        link_clicks:
          type: integer
          nullable: true
          description: Outbound clicks to Spotify via the Soundlink landing page.
        spend_media:
          type: number
          description: Amount billed to Meta for ad delivery. Excludes Soundlink fees. USD.
        spend_total:
          type: number
          description: Total billed by Soundlink (spend_media + fees). USD.
        fees:
          type: number
          description: Soundlink service fee (spend_total - spend_media). USD.
        currency:
          type: string
          description: Currency for spend fields. Currently always `USD`.
        cpl:
          type: number
          description: Cost per new listener (spend_media / listeners).
        cpf:
          type: number
          description: Cost per follower (spend_media / followers).
        streams_per_listener:
          type: number
          description: |
            streams / total_listeners. Matches dashboard S/L. Zero if
            total_listeners is zero.

    MetricsOverviewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/MetricsOverview'
        meta:
          $ref: '#/components/schemas/Meta'

    CreativeMetricsChild:
      type: object
      required:
        - caption
        - language
        - spotify_track_id
        - timestamp_start_ms
        - timestamp_end_ms
        - listeners
        - followers
        - link_clicks
        - cpl
        - cpf
        - cpc_linkclick
        - frequency
      properties:
        caption:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
          description: Render language. Null when the render has no language.
        spotify_track_id:
          type: string
          description: Spotify track id stored on the render. Not a lookup.
        timestamp_start_ms:
          type: integer
          nullable: true
          description: |
            Start of the audio cut in milliseconds from the beginning of the
            track. Null when the cut is not a ready sound for this organization.
        timestamp_end_ms:
          type: integer
          nullable: true
          description: |
            End of the audio cut in milliseconds. Null when the cut is not a
            ready sound for this organization.
        listeners:
          type: integer
          nullable: true
          description: Lifetime listeners. Null when the variant has no performance row.
        followers:
          type: integer
          nullable: true
        link_clicks:
          type: integer
          nullable: true
        cpl:
          type: number
          nullable: true
        cpf:
          type: number
          nullable: true
        cpc_linkclick:
          type: number
          nullable: true
        frequency:
          type: number
          nullable: true

    CreativeMetricsGroup:
      type: object
      required:
        - video_id
        - caption
        - listeners
        - followers
        - link_clicks
        - cpl
        - cpf
        - cpc_linkclick
        - frequency
        - children
      properties:
        video_id:
          type: string
          description: Background video id. Groups with no video id are omitted.
        caption:
          type: string
          nullable: true
          description: Caption of the highest-spend child.
        listeners:
          type: integer
          nullable: true
        followers:
          type: integer
          nullable: true
        link_clicks:
          type: integer
          nullable: true
        cpl:
          type: number
          nullable: true
        cpf:
          type: number
          nullable: true
        cpc_linkclick:
          type: number
          nullable: true
        frequency:
          type: number
          nullable: true
        children:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreativeMetricsChild'

    CreativeMetrics:
      type: object
      required: [creatives]
      properties:
        creatives:
          type: array
          items:
            $ref: '#/components/schemas/CreativeMetricsGroup'

    CreativeMetricsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CreativeMetrics'
        meta:
          $ref: '#/components/schemas/Meta'

    CreativeDailyMetricsRow:
      type: object
      required:
        - date
        - meta_ad_creative_id
        - spend_media
        - impressions
        - followers
        - cpf
      properties:
        date:
          type: string
          format: date
          description: UTC calendar date (`YYYY-MM-DD`).
        meta_ad_creative_id:
          type: string
          description: Current Meta ad creative. Ads that share this id are summed for the day.
        spend_media:
          type: number
          description: Meta media spend for the day. Fees are not included.
        impressions:
          type: number
          description: Meta impressions for the day.
        followers:
          type: number
          description: Follows attributed for the day.
        cpf:
          type: number
          nullable: true
          description: Cost per follower (`spend_media / followers`) for this row. Null when followers is zero.

    CreativeDailyMetrics:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreativeDailyMetricsRow'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreativeDailyMetricsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CreativeDailyMetrics'
        meta:
          $ref: '#/components/schemas/Meta'

    BreakdownRow:
      type: object
      description: |
        One row of the `campaign_country_daily` v1.1 schema.
        Primary key: `(provider, account_id, report_date, campaign_id, country_code)`.
        Rows are idempotent — re-ingesting on the primary key is safe.
        Values for a given `report_date` may be revised for up to 7 days after
        the date closes due to delayed events from Meta and Spotify.
      required:
        - provider
        - account_id
        - schema_version
        - report_date
        - report_date_timezone
        - exported_at
        - campaign_id
        - campaign_name
        - campaign_target_type
        - country_code
        - streams
        - listeners
        - new_listeners
        - returning_listeners
        - total_listeners
        - followers
        - streams_per_listener
        - spend_media
        - spend_total
        - fees
        - currency
        - currency_account
        - cpl
        - cpf
        - cost_per_result
      properties:
        provider:
          type: string
          enum: [soundlink]
          description: Always `soundlink`. Identifies the data provider for multi-source warehouses.
        account_id:
          type: string
          description: Soundlink organization ID (UUID).
        schema_version:
          type: string
          description: Schema version. Pin your ingest pipeline to this value. `1.1` adds listener splits.
          example: '1.1'
        report_date:
          type: string
          format: date
          description: UTC calendar date the metrics belong to (`YYYY-MM-DD`).
        report_date_timezone:
          type: string
          enum: [UTC]
          description: Always `UTC`.
        exported_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when this row was generated. Use for deduplication if the same `report_date` is re-delivered.
        campaign_id:
          type: string
          description: Soundlink campaign UUID. Stable for the lifetime of the campaign.
        campaign_name:
          type: string
          description: Human-readable campaign name.
        campaign_target_type:
          type: string
          nullable: true
          enum: [track, playlist]
          description: Whether this campaign promotes a track or playlist. `null` if undetermined.
        campaign_target_isrc:
          type: string
          nullable: true
          description: ISRC of the promoted track. Populated when `campaign_target_type = track`; otherwise `null`.
        campaign_target_spotify_track_id:
          type: string
          nullable: true
          description: Spotify track ID of the promoted track. Populated when `campaign_target_type = track`; otherwise `null`.
        campaign_target_playlist_id:
          type: string
          nullable: true
          description: Spotify playlist ID. Populated when `campaign_target_type = playlist`; otherwise `null`.
        country_code:
          type: string
          description: ISO 3166-1 alpha-2. Derived from the listener's IP at time of engagement. Uppercase.
        impressions:
          type: integer
          nullable: true
          description: Total Meta ad impressions served in this country on this day.
        ad_clicks:
          type: integer
          nullable: true
          description: Total clicks on the Meta ad (all click types). Use `ctr_adclick` for ad-level CTR.
        link_clicks:
          type: integer
          nullable: true
          description: CTA clicks across all DSPs on the Soundlink landing page. Use `cpc_linkclick` / `ctr_linkclick` for outbound CPC/CTR.
        streams:
          type: integer
          description: Spotify streams attributed to this campaign in this country on this day (7-day click-through window). Observed events, not modelled estimates.
        listeners:
          type: integer
          description: |
            Attributed new Spotify listeners for this country-day (same as
            `new_listeners`). Basis for `cpl`.
        new_listeners:
          type: integer
          description: Alias of `listeners` (attributed new).
        returning_listeners:
          type: integer
          description: |
            Returning Spotify listeners for this country-day. Meta known-tier
            conversion rows are `0`.
        total_listeners:
          type: integer
          description: new_listeners + returning_listeners for this row.
        followers:
          type: integer
          description: Spotify artist follower gains attributed to this campaign in this country on this day (7-day click-through window).
        streams_per_listener:
          type: number
          description: |
            streams / total_listeners for this row. Zero if total_listeners is
            zero.
        spend_media:
          type: number
          description: Amount billed to Meta for ad delivery in this country on this day. Excludes Soundlink service fees. In `currency`.
        spend_total:
          type: number
          description: Total billed by Soundlink (spend_media + fees). Computed as `spend_media / (1 - fee_pct)`.
        fees:
          type: number
          description: Soundlink service fee (spend_total - spend_media).
        currency:
          type: string
          description: Currency for spend fields. Currently always `USD`.
        currency_account:
          type: string
          description: Account billing currency. Currently always `USD`. Will differ from `currency` once EUR delivery is available.
        cpl:
          type: number
          description: Cost per new listener (spend_media / listeners). Zero if listeners is zero.
        cpf:
          type: number
          description: Cost per follower (spend_media / followers). Zero if followers is zero.
        cpc_linkclick:
          type: number
          nullable: true
          description: Cost per outbound click (spend_media / link_clicks). Null if link_clicks is null or zero.
        ctr_linkclick:
          type: number
          nullable: true
          description: Outbound CTR (link_clicks / impressions). Null if impressions is null or zero.
        ctr_adclick:
          type: number
          nullable: true
          description: Meta ad CTR (ad_clicks / impressions). Null if impressions is null or zero.
        cost_per_result:
          type: number
          description: Cost per primary campaign result. Currently equivalent to `cpf` (cost per follower). See `result_type`.
        result_type:
          type: string
          nullable: true
          enum: [lp_click, stream, follow]
          description: The conversion event used for `cost_per_result`. Currently always `follow`.

    MetricsBreakdownResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [schemaVersion, items, pagination]
          properties:
            schemaVersion:
              type: string
              description: Version of the `campaign_country_daily` row schema. Pin your ingest pipeline to this.
              example: '1.0'
            items:
              type: array
              items:
                $ref: '#/components/schemas/BreakdownRow'
            pagination:
              $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/Meta'

    MetricsEngagementResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [schemaVersion, items, pagination]
          properties:
            schemaVersion:
              type: string
              description: Version of the `campaign_engagement_daily` row schema. Pin your ingest pipeline to this.
              example: '1.0'
            items:
              type: array
              items:
                $ref: '#/components/schemas/EngagementRow'
            pagination:
              $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/Meta'

    # --- Engagement ---

    EngagementRow:
      type: object
      description: |
        One row of the `campaign_engagement_daily` v1.0 schema.
        Primary key: `(provider, account_id, report_date, campaign_id, engagement_context, country_code, engaged_spotify_track_id)`.
        Rows are idempotent — re-ingesting on the primary key is safe.
        Values for a given `report_date` may be revised for up to 7 days after
        the date closes due to delayed Spotify playback events.
      required:
        - provider
        - account_id
        - schema_version
        - report_date
        - report_date_timezone
        - exported_at
        - campaign_id
        - campaign_name
        - campaign_target_type
        - status
        - engagement_context
        - country_code
        - engaged_spotify_track_id
        - engaged_track_name
        - new_listeners
        - returning_listeners
        - listeners
        - new_listener_streams
        - returning_listener_streams
        - streams
        - spl
      properties:
        provider:
          type: string
          enum: [soundlink]
          description: Always `soundlink`. Identifies the data provider for multi-source warehouses.
        account_id:
          type: string
          description: Soundlink organization ID (UUID).
        schema_version:
          type: string
          description: Schema version string. Pin your ingest pipeline to this value.
          example: '1.0'
        report_date:
          type: string
          format: date
          description: UTC calendar date the metrics belong to (`YYYY-MM-DD`). Rows can change for up to 7 days after close.
        report_date_timezone:
          type: string
          enum: [UTC]
          description: Always `UTC`.
        exported_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when this row was generated. Use for deduplication if the same `report_date` is re-delivered.
        campaign_id:
          type: string
          description: Soundlink campaign UUID. Stable for the lifetime of the campaign.
        campaign_name:
          type: string
          description: Human-readable campaign name.
        campaign_target_type:
          type: string
          nullable: true
          enum: [track, playlist]
          description: Whether this campaign promotes a track or a playlist. `null` if undetermined.
        campaign_target_isrc:
          type: string
          nullable: true
          description: ISRC of the promoted track. Populated when `campaign_target_type = track`; otherwise `null`.
        campaign_target_spotify_track_id:
          type: string
          nullable: true
          description: Spotify track ID of the promoted track. Populated when `campaign_target_type = track`; otherwise `null`.
        campaign_target_playlist_id:
          type: string
          nullable: true
          description: Spotify playlist ID. Populated when `campaign_target_type = playlist`; otherwise `null`.
        status:
          type: string
          enum: [active, ended, scheduled]
          description: |
            Campaign lifecycle status on `report_date`.
            `active` = campaign was running; `ended` = campaign had ended or was refunded;
            `scheduled` = `report_date` is before campaign start.
            Post-campaign rows will have `status = ended`.
        engagement_context:
          type: string
          enum: [catalog, playlist]
          description: |
            Which dashboard section the row maps to.
            `catalog` = same-artist spillover (and direct promoted-track plays) on track campaigns.
            `playlist` = per-track performance inside the promoted playlist on playlist campaigns.
        country_code:
          type: string
          description: ISO 3166-1 alpha-2. Derived from the listener's IP at time of engagement. Uppercase.
          example: US
        engaged_track_isrc:
          type: string
          nullable: true
          description: |
            ISRC of the track that received listens. May differ from `campaign_target_isrc`
            for catalog spillover rows. `null` if ISRC could not be resolved.
        engaged_spotify_track_id:
          type: string
          description: |
            Stable track identifier used in the primary key. Currently this is the
            Spotify track ID for the engaged track.
          example: 4cOdK2wGLETKBW3PvgPWqT
        engaged_track_name:
          type: string
          description: Display name of the engaged track.
        playlist_position:
          type: integer
          nullable: true
          minimum: 1
          description: |
            1-based slot of the engaged track on the promoted playlist for `report_date` (1 = top).
            Populated only when `engagement_context = playlist` and that day's playlist crawl listed the track.
            `null` for catalog rows; before the day's crawl completes (current UTC day is often null until later morning UTC);
            when the track was not listed or could not be matched to that day's crawl; or while historical backfill is still catching up.
            Field is beta until historical backfill finishes. Treat `null` as unavailable — not an error.
        new_listeners:
          type: integer
          minimum: 0
          description: Unique listeners whose first play of this track on this smart link occurred on `report_date`.
        returning_listeners:
          type: integer
          minimum: 0
          description: Unique listeners who played this track on `report_date` but whose first play was on an earlier date.
        listeners:
          type: integer
          minimum: 0
          description: |
            Total unique listeners on `report_date`: `new_listeners + returning_listeners`.
            **Do not sum across days** — the same listener can appear on multiple `report_date` rows.
        new_listener_streams:
          type: integer
          minimum: 0
          description: Stream count from new listeners on `report_date`.
        returning_listener_streams:
          type: integer
          minimum: 0
          description: Stream count from returning listeners on `report_date`.
        streams:
          type: integer
          minimum: 0
          description: |
            Total streams on `report_date`: `new_listener_streams + returning_listener_streams`.
            Safe to sum within a day; summing across days counts repeat listens.
        spl:
          type: number
          description: Streams per listener (`streams / listeners`). Zero if `listeners` is zero.

    # --- Soundlinks ---

    SoundlinkStatus:
      type: string
      enum: [draft, active, archived]

    SoundlinkSummary:
      type: object
      required: [soundlinkId, organizationId, name, url, targetType, status, createdAt]
      properties:
        soundlinkId:
          type: string
          description: |
            Unique ID of this soundlink (URL-safe string, same ID used in the
            public sndl.ink URL).
          example: V1StGXR8_Z5jdHi6B-myT
        organizationId:
          type: string
          description: Soundlink organization ID (UUID).
        name:
          type: string
          description: Human-readable soundlink name.
        url:
          type: string
          format: uri
          description: Public soundlink landing page URL.
          example: https://sndl.ink/soundlink/V1StGXR8_Z5jdHi6B-myT
        targetType:
          type: string
          nullable: true
          enum: [track, album, playlist]
          description: |
            Type of Spotify resource this soundlink promotes. `null` if the
            target could not be determined.
        spotifyUrl:
          type: string
          format: uri
          nullable: true
          description: Spotify URL of the promoted resource.
        status:
          $ref: '#/components/schemas/SoundlinkStatus'
        createdAt:
          type: string
          format: date-time

    SoundlinkListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items, pagination]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SoundlinkSummary'
            pagination:
              $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/Meta'

    CreateSoundlinkRequest:
      type: object
      required: [name, spotifyUrl]
      properties:
        name:
          type: string
          minLength: 1
          description: Human-readable soundlink name.
        spotifyUrl:
          type: string
          format: uri
          description: |
            HTTPS Spotify track or playlist URL. Album, artist, and URI
            (`spotify:track:...`) forms are rejected. An optional `intl-xx`
            path segment is accepted. Query strings are stripped before
            lookup. The resource must currently exist on Spotify.
          example: https://open.spotify.com/track/11dFghVXANMlKmJXsNCbNl
        autoFollow:
          type: boolean
          default: false
          description: |
            When true, fans who connect Spotify from the landing page are
            asked to follow the track artist (`artistIdFollow`, or the
            track's primary artist when omitted), or the playlist itself
            when `spotifyUrl` is a playlist. Defaults to false.
        artistIdFollow:
          type: string
          description: |
            Spotify artist ID used for auto-follow on track links.
            Optional. Persisted even when `autoFollow` is false. For
            multi-artist tracks, pass the artist that should be followed.
            Ignored when `spotifyUrl` is a playlist.
        metaPixelId:
          type: string
          description: |
            Meta pixel ID. Must be sent together with
            `metaConversionAccessToken`. Omit both to skip Meta tracking.
        metaConversionAccessToken:
          type: string
          writeOnly: true
          description: |
            Meta Conversions API access token. Write-only: accepted on create,
            never returned on GET. Must be sent together with `metaPixelId`.
        appleMusicUrl:
          type: string
          format: uri
          description: |
            Optional HTTPS Apple Music URL. Accepted shapes: a song
            (`/song/{slug}/{id}`), a catalog playlist (`pl.`), a library
            playlist (`pl.u-`), or an album share-sheet link with `?i={songId}`
            (stored as the canonical song URL). Host must be `music.apple.com`
            with a two-letter storefront. Songs and catalog playlists are
            verified in that storefront; missing content returns
            `400 invalid_request`.
            Provider outages or rate limits warn and allow create. Library
            playlists are format-checked only. Omit to leave Apple Music unset.
          example: https://music.apple.com/us/song/anti-hero/1645937493
        youtubeMusicUrl:
          type: string
          format: uri
          description: |
            Optional HTTPS YouTube Music URL. Accepted shapes: a song
            (`music.youtube.com/watch?v=…`, `youtube.com/watch?v=…`, or
            `youtu.be/…`) or a playlist (`…/playlist?list=…`). Shorts,
            live, channel, and browse links are rejected. A video or
            playlist that does not exist on YouTube returns
            `400 invalid_request`. Quota, auth, or upstream failures warn and
            allow create. Omit to leave YouTube Music unset.
          example: https://music.youtube.com/watch?v=dQw4w9WgXcQ
        attributionEnabled:
          type: boolean
          default: true
          description: |
            When false, the landing page skips Spotify login and only tracks
            the landing-page click. Omit or send true to keep attribution.
            Sending false requires the organization to be allowed to turn
            attribution off, and cannot be combined with `autoFollow: true`.

    SoundlinkDetail:
      allOf:
        - $ref: '#/components/schemas/SoundlinkSummary'
        - type: object
          required:
            - autoFollow
            - artistIdFollow
            - metaPixelId
            - tiktokPixelId
            - appleMusicUrl
            - youtubeMusicUrl
            - attributionEnabled
          properties:
            autoFollow:
              type: boolean
              description: Whether auto-follow is enabled on this soundlink.
            artistIdFollow:
              type: string
              nullable: true
              description: |
                Spotify artist ID configured for auto-follow on track links.
                Unused for playlists. `null` if not set.
            metaPixelId:
              type: string
              nullable: true
              description: Meta pixel ID configured on this soundlink. `null` if not set.
            tiktokPixelId:
              type: string
              nullable: true
              description: TikTok pixel ID configured on this soundlink. `null` if not set.
            appleMusicUrl:
              type: string
              format: uri
              nullable: true
              description: |
                Apple Music URL stored on this soundlink. `null` if not set.
                Share-sheet album links are returned as the canonical song URL.
            youtubeMusicUrl:
              type: string
              format: uri
              nullable: true
              description: |
                YouTube Music URL stored on this soundlink. `null` if not set.
                Input hosts such as `youtu.be` are returned as the canonical
                `music.youtube.com` song or playlist URL.
            attributionEnabled:
              type: boolean
              description: |
                Whether this soundlink keeps Spotify attribution. `false`
                means the landing page skips login and only tracks the click.

    SoundlinkDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SoundlinkDetail'
        meta:
          $ref: '#/components/schemas/Meta'

    SendTestEventResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [soundlinkId, status]
          properties:
            soundlinkId:
              type: string
              description: Soundlink that received the test event.
            status:
              type: string
              enum: [sent]
              description: Present when the stored pixel test event was sent.
        meta:
          $ref: '#/components/schemas/Meta'

    SoundlinkMetricsOverview:
      type: object
      description: |
        Soundlink-level totals for the requested date range. Additive fields
        are sums of `api_smart_link_country_daily` country-day rows.
      required: [views, streams, listeners, followers, streams_per_listener]
      properties:
        views:
          type: integer
          description: Soundlink landing page views in the period (sum of country-day rows).
        link_clicks:
          type: integer
          nullable: true
          description: |
            CTA clicks across all DSPs on the landing page. Null if not tracked
            for this soundlink type.
        streams:
          type: integer
          description: Attributed Spotify streams (sum of country-day rows).
        listeners:
          type: integer
          description: |
            Sum of country-day `new_listeners` from the mart (first-play
            attributed listeners). Not period-unique across days/countries,
            and not equal to summing breakdown `listeners` (new + returning).
        followers:
          type: integer
          description: Attributed Spotify artist follower gains in the period.
        streams_per_listener:
          type: number
          description: streams / listeners. Zero if listeners is zero.
        ctr_lp:
          type: number
          nullable: true
          description: |
            Landing page click-through rate (link_clicks / views). Computed
            against landing page views, not ad impressions — do not combine
            with `ctr_linkclick` from campaign metrics. Null if views is zero
            or link_clicks is null.

    SoundlinkMetricsOverviewResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SoundlinkMetricsOverview'
        meta:
          $ref: '#/components/schemas/Meta'

    SoundlinkCountryDailyRow:
      type: object
      description: |
        One row of the `soundlink_country_daily` v1.0 schema.
        Primary key: `(provider, account_id, report_date, soundlink_id, country_code)`.
        Rows are idempotent — re-ingesting on the primary key is safe.
        Values for a given `report_date` may be revised for up to 7 days after
        the date closes due to delayed Spotify playback events.
        Rows contain no financial fields.
      required:
        - provider
        - account_id
        - schema_version
        - report_date
        - report_date_timezone
        - exported_at
        - soundlink_id
        - soundlink_name
        - soundlink_target_type
        - country_code
        - views
        - streams
        - listeners
        - followers
        - streams_per_listener
      properties:
        provider:
          type: string
          enum: [soundlink]
          description: Always `soundlink`. Identifies the data provider for multi-source warehouses.
        account_id:
          type: string
          description: Soundlink organization ID (UUID).
        schema_version:
          type: string
          description: Schema version. Pin your ingest pipeline to this value.
          example: '1.0'
        report_date:
          type: string
          format: date
          description: UTC calendar date the metrics belong to (`YYYY-MM-DD`).
        report_date_timezone:
          type: string
          enum: [UTC]
          description: Always `UTC`.
        exported_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when this row was generated. Use for deduplication if the same `report_date` is re-delivered.
        soundlink_id:
          type: string
          description: Unique ID of this soundlink.
          example: V1StGXR8_Z5jdHi6B-myT
        soundlink_name:
          type: string
          description: Human-readable soundlink name.
        soundlink_target_type:
          type: string
          nullable: true
          enum: [track, playlist]
          description: Whether this soundlink promotes a track or playlist. `null` if undetermined.
        soundlink_target_isrc:
          type: string
          nullable: true
          description: ISRC of the promoted track. Populated when `soundlink_target_type = track`; otherwise `null`.
        soundlink_target_spotify_track_id:
          type: string
          nullable: true
          description: Spotify track ID of the promoted track. Populated when `soundlink_target_type = track`; otherwise `null`.
        soundlink_target_playlist_id:
          type: string
          nullable: true
          description: Spotify playlist ID. Populated when `soundlink_target_type = playlist`; otherwise `null`.
        country_code:
          type: string
          description: ISO 3166-1 alpha-2. Derived from the listener's IP at time of engagement. Uppercase.
        views:
          type: integer
          description: Soundlink landing page views in this country on this day.
        link_clicks:
          type: integer
          nullable: true
          description: |
            CTA clicks across all DSPs on the landing page. Null if not tracked
            for this soundlink type.
        streams:
          type: integer
          description: |
            Spotify streams attributed to this soundlink in this country on this
            day: `new_listener_streams + returning_listener_streams`. Observed
            Spotify-side events, not modelled estimates. Safe to sum within a
            day; summing across days counts repeat listens.
        listeners:
          type: integer
          description: |
            Unique Spotify listeners attributed to this soundlink in this
            country on this day: `new_listeners + returning_listeners`.
            **Do not sum across days** — the same listener can appear on
            multiple `report_date` rows.
        new_listeners:
          type: integer
          nullable: true
          description: Unique listeners whose first play via this soundlink occurred on `report_date` in this country.
        returning_listeners:
          type: integer
          nullable: true
          description: Unique listeners who played on `report_date` in this country but whose first play was on an earlier date.
        new_listener_streams:
          type: integer
          nullable: true
          description: Stream count from new listeners on `report_date` in this country.
        returning_listener_streams:
          type: integer
          nullable: true
          description: Stream count from returning listeners on `report_date` in this country.
        followers:
          type: integer
          description: Spotify artist follower gains attributed to this soundlink in this country on this day.
        streams_per_listener:
          type: number
          description: streams / listeners for this row. Zero if listeners is zero.
        ctr_lp:
          type: number
          nullable: true
          description: |
            Landing page click-through rate (link_clicks / views). Computed
            against landing page views, not ad impressions — do not combine
            with `ctr_linkclick` from `campaign_country_daily`. Null if views
            is zero or link_clicks is null.

