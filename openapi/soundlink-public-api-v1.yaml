  /v1/campaigns/{campaignId}/metrics/engagement/export:
    get:
      operationId: exportCampaignEngagement
      summary: Campaign engagement export (JSONL)
      description: |
        Streams the full engagement dataset for a campaign as
        **newline-delimited JSON (JSONL)**. Every line is a complete, valid
        JSON object conforming to the `campaign_engagement_daily` v1.0 schema
        — identical to the rows returned by `GET /metrics/engagement` but
        without pagination or an envelope wrapper.

        Designed for data pipeline consumers: load directly into BigQuery,
        Snowflake, or any JSONL-aware ingest tool without cursor logic.

        **Usage:**
        ```
        GET /v1/campaigns/{campaignId}/metrics/engagement/export
        Accept: application/x-ndjson
        ```

        **Response body (one JSON object per line, no trailing comma):**
        ```
        {"provider":"soundlink","report_date":"2026-04-01","streams":89,...}
        {"provider":"soundlink","report_date":"2026-04-02","streams":104,...}
        ```

        **Date range:** if you omit both dates, defaults to the last **90 days**
        ending today. Override with `startDate` / `endDate`. **Responses are
        capped at 90 days** — a wider range returns `400 invalid_query_parameter`.
        Page longer histories in 90-day slices.

        **Mutability:** rows for a given `report_date` can be revised for up to
        7 days after the date closes. Re-fetching and re-ingesting on the
        primary key is safe (idempotent).

        Requires the `metrics:read` scope. Accepts API key or OAuth Bearer.
      tags: [Metrics]
      security:
        - apiKeyBearerAuth: []
        - oauthBearer: []
      x-required-scope: metrics:read
      parameters:
        - $ref: '#/components/parameters/campaignId'
        - $ref: '#/components/parameters/startDate'
        - $ref: '#/components/parameters/endDate'
        - name: engagementContext
          in: query
          schema:
            type: string
            enum: [catalog, playlist]
          description: Filter to a single engagement context. Omit to return both.
      responses:
        '200':
          description: |
            JSONL stream. Each line is a `campaign_engagement_daily` v1.0 row.
            Lines are sorted by `(report_date asc, engagement_context, country_code, engaged_spotify_track_id)`.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: |
                `attachment; filename="engagement_{campaignId}_{startDate}_{endDate}.jsonl"`
              example: 'attachment; filename="engagement_8ccd7b88_2026-04-01_2026-05-01.jsonl"'
            X-Row-Count:
              schema:
                type: integer
              description: Total number of rows in the response. Useful for progress tracking when streaming.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/EngagementRow'
              example: |
                {"provider":"soundlink","account_id":"a7ac3173-2f71-4e79-921f-d15d7112cc9a","schema_version":"1.0","report_date":"2026-04-08","report_date_timezone":"UTC","exported_at":"2026-05-22T10:12:11Z","campaign_id":"8ccd7b88-2591-4b94-848f-f142f5c6bba1","campaign_name":"9 To 5","campaign_target_type":"track","campaign_target_isrc":"DEXW62500272","campaign_target_spotify_track_id":"2RkZ5WPkKyBf0u8vN3dNgb","campaign_target_playlist_id":null,"status":"ended","engagement_context":"catalog","country_code":"US","engaged_track_isrc":"DEXW62500001","engaged_spotify_track_id":"4cOdK2wGLETKBW3PvgPWqT","engaged_track_name":"Till The Sunrise","playlist_position":null,"new_listeners":42,"returning_listeners":18,"listeners":60,"new_listener_streams":58,"returning_listener_streams":31,"streams":89,"spl":1.48}
                {"provider":"soundlink","account_id":"a7ac3173-2f71-4e79-921f-d15d7112dd11","schema_version":"1.0","report_date":"2026-04-08","report_date_timezone":"UTC","exported_at":"2026-05-22T10:12:11Z","campaign_id":"f1e28d31-c358-4284-9bef-00a2334625fd","campaign_name":"Sleep Playlist","campaign_target_type":"playlist","campaign_target_isrc":null,"campaign_target_spotify_track_id":null,"campaign_target_playlist_id":"37i9dQZF1DXcBWIGoYBM5M","status":"active","engagement_context":"playlist","country_code":"DE","engaged_track_isrc":"DEXW62500001","engaged_spotify_track_id":"4cOdK2wGLETKBW3PvgPWqT","engaged_track_name":"Till The Sunrise","playlist_position":14,"new_listeners":19,"returning_listeners":7,"listeners":26,"new_listener_streams":24,"returning_listener_streams":11,"streams":35,"spl":1.35}
